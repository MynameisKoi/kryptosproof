[project]
name = "kryptosproof"
version = "0.1.0"
description = "Automated web security audit platform — multi-agent red/blue team"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=0.0.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "docker>=7.0.0",
    "python-dotenv>=1.0.0",
    "logfire>=4.29.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires LLM API keys (Anthropic or Gemini/Google)",
]
